<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PARA NONNA. Productos cotidianos, pensados para vivir mejor."
    />
    <title>PARA NONNA | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="hero">
      <div class="hero__background" aria-hidden="true"></div>

      <header class="topbar">
        <a class="topbar__logo" href="#" aria-label="PARA NONNA">
          <img
            src="assets/icons/para_nonna_imagotipo_header.png"
            alt="PARA NONNA"
            width="360"
            height="215"
          />
        </a>

        <button class="cart" type="button" aria-label="Bolsa de compras">
          <svg
            viewBox="0 0 24 26"
            width="22"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3.5 8h17l-1.3 15.5h-14.4z" />
            <path d="M8 8V6.5a4 4 0 0 1 8 0V8" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <section class="hero__content" aria-labelledby="brand-name">
        <h1 id="brand-name">PARANONNA</h1>

        <div class="divider" aria-hidden="true">
          <span class="divider__line"></span>
          <svg
            class="divider__leaf"
            viewBox="0 0 60 24"
            width="60"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 20 Q30 4 56 12" />
            <path d="M16 15 Q14 8 20 5 Q22 12 16 15z" />
            <path d="M28 11 Q26 4 32 1 Q34 8 28 11z" />
            <path d="M40 9 Q40 2 46 1 Q46 8 40 9z" />
          </svg>
          <span class="divider__line"></span>
        </div>

        <p class="tagline">para vivir mejor</p>

        <p class="coming-soon">Coming soon</p>

        <p class="subtitle">
          Productos para el bienestar y comodidad en cada etapa de la vida.
        </p>
      </section>

      <footer class="footer">
        <p class="footer__copy">
          &copy; 2026 PARA NONNA &middot; Todos los derechos reservados
        </p>

        <nav class="social-links" aria-label="Redes sociales">
          <a
            href="https://www.instagram.com/paranonna.cl/"
            target="_blank"
            rel="noreferrer"
          >
            Instagram
          </a>

          <a
            href="https://www.facebook.com/paranonna?locale=es_LA"
            target="_blank"
            rel="noreferrer"
          >
            Facebook
          </a>
        </nav>
      </footer>
    </main>
  </body>
</html>
