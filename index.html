<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PARA NONNA. Productos cotidianos, pensados para vivir mejor."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>PARA NONNA | Próximamente</title>

    <link rel="canonical" href="https://paranonna.cl/" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/favicon-512.png" />
    <link rel="apple-touch-icon" href="assets/icons/favicon-512.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PARA NONNA" />
    <meta property="og:title" content="Para Nonna — Para vivir mejor" />
    <meta
      property="og:description"
      content="Productos para el bienestar y comodidad en cada etapa de la vida."
    />
    <meta property="og:url" content="https://paranonna.cl/" />
    <meta property="og:image" content="https://paranonna.cl/assets/og-image.jpg" />
    <meta property="og:image:width" content="2280" />
    <meta property="og:image:height" content="1326" />
    <meta property="og:locale" content="es_CL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Para Nonna — Para vivir mejor" />
    <meta name="twitter:image" content="https://paranonna.cl/assets/og-image.jpg" />

    <link
      rel="preload"
      href="assets/fonts/playfair-display.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/cormorant-garamond.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="hero">
      <div class="hero__background" aria-hidden="true"></div>

      <header class="topbar">
        <a class="topbar__logo" href="#" aria-label="PARA NONNA">
          <img
            src="assets/icons/para_nonna_imagotipo_header.png"
            alt="PARA NONNA"
            width="360"
            height="215"
          />
        </a>

        <button
          type="button"
          class="topbar__menu-button nonna-icon"
          aria-label="Abrir menú"
          aria-controls="topbar-menu"
          aria-expanded="false"
        >
          <svg viewBox="0 0 240 120" aria-hidden="true">
            <circle cx="75" cy="62" r="34" class="glasses" />
            <circle cx="165" cy="62" r="34" class="glasses" />
            <path d="M109 58 Q120 50 131 58" class="glasses" />
            <path d="M41 61 H27 M199 61 H213" class="glasses" />
            <path d="M106 91 Q120 104 134 91" class="glasses" />
            <path
              d="M145 64 Q165 78 185 64"
              class="wink"
            />
          </svg>
        </button>

        <div
          id="topbar-menu"
          class="topbar__menu-panel"
          data-open="false"
          aria-hidden="true"
        >
          <a href="https://www.instagram.com/paranonna.cl/" target="_blank" rel="noreferrer">Instagram</a>
          <a href="https://www.facebook.com/paranonna?locale=es_LA" target="_blank" rel="noreferrer">Facebook</a>
          <a href="#brand-name">Inicio</a>
        </div>
      </header>

      <section class="hero__content" aria-labelledby="brand-name">
        <h1 id="brand-name">PARANONNA</h1>

        <div class="divider" aria-hidden="true">
          <span class="divider__line"></span>
          <svg
            class="divider__leaf"
            viewBox="0 0 60 24"
            width="60"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 20 Q30 4 56 12" />
            <path d="M16 15 Q14 8 20 5 Q22 12 16 15z" />
            <path d="M28 11 Q26 4 32 1 Q34 8 28 11z" />
            <path d="M40 9 Q40 2 46 1 Q46 8 40 9z" />
          </svg>
          <span class="divider__line"></span>
        </div>

        <p class="tagline">para vivir mejor</p>

        <p class="coming-soon">Próximamente</p>

        <p class="subtitle">
          Productos para el bienestar y comodidad en cada etapa de la vida.
        </p>
      </section>

      <footer class="footer">
        <p class="footer__copy">
          &copy; 2026 PARA NONNA &middot; Todos los derechos reservados
        </p>

        <nav class="social-links" aria-label="Redes sociales">
          <a
            href="https://www.instagram.com/paranonna.cl/"
            target="_blank"
            rel="noreferrer"
          >
            Instagram
          </a>

          <a
            href="https://www.facebook.com/paranonna?locale=es_LA"
            target="_blank"
            rel="noreferrer"
          >
            Facebook
          </a>
        </nav>
      </footer>
    </main>

    <script>
      const menuButton = document.querySelector('.topbar__menu-button');
      const menuPanel = document.getElementById('topbar-menu');
      let hasWinkedHover = false;

      function resetWink() {
        menuButton.classList.remove('nonna-icon--winking');
      }

      function triggerWink() {
        menuButton.classList.add('nonna-icon--winking');
        window.setTimeout(resetWink, 450);
      }

      function setMenuState(open) {
        menuPanel.setAttribute('data-open', open ? 'true' : 'false');
        menuPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
        menuButton.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      function toggleMenu() {
        const isOpen = menuPanel.getAttribute('data-open') === 'true';
        setMenuState(!isOpen);
      }

      if (menuButton && menuPanel) {
        menuButton.addEventListener('click', (event) => {
          event.preventDefault();
          triggerWink();
          window.setTimeout(toggleMenu, 450);
        });

        menuButton.addEventListener('pointerenter', () => {
          if (!hasWinkedHover) {
            hasWinkedHover = true;
            triggerWink();
          }
        });
      }
    </script>
  </body>
</html>
