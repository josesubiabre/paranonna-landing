<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada | PARA NONNA</title>

    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/favicon-512.png" />
    <link rel="apple-touch-icon" href="/assets/icons/favicon-512.png" />

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <main class="hero">
      <div class="hero__background" aria-hidden="true"></div>

      <header class="topbar">
        <a class="topbar__logo" href="/" aria-label="PARA NONNA">
          <img
            src="/assets/icons/para_nonna_imagotipo_header.png"
            alt="PARA NONNA"
            width="360"
            height="215"
          />
        </a>
      </header>

      <section class="hero__content" aria-labelledby="error-title">
        <h1 id="error-title">404</h1>

        <div class="divider" aria-hidden="true">
          <span class="divider__line"></span>
          <svg
            class="divider__leaf"
            viewBox="0 0 60 24"
            width="60"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 20 Q30 4 56 12" />
            <path d="M16 15 Q14 8 20 5 Q22 12 16 15z" />
            <path d="M28 11 Q26 4 32 1 Q34 8 28 11z" />
            <path d="M40 9 Q40 2 46 1 Q46 8 40 9z" />
          </svg>
          <span class="divider__line"></span>
        </div>

        <p class="tagline">Página no encontrada</p>

        <a class="coming-soon" href="/">Volver al inicio</a>

        <p class="subtitle">
          La página que buscas no existe o fue movida.
        </p>
      </section>

      <footer class="footer">
        <p class="footer__copy">
          &copy; 2026 PARA NONNA &middot; Todos los derechos reservados
        </p>

        <nav class="social-links" aria-label="Redes sociales">
          <a
            href="https://www.instagram.com/paranonna.cl/"
            target="_blank"
            rel="noreferrer"
          >
            Instagram
          </a>

          <a
            href="https://www.facebook.com/paranonna?locale=es_LA"
            target="_blank"
            rel="noreferrer"
          >
            Facebook
          </a>
        </nav>
      </footer>
    </main>
  </body>
</html>
